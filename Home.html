<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
<section class="hero">

    <header class="hero-content">
        <h1>Spot Play – Music Made Simple</h1>
        
        <p>
            Discover. Listen. Enjoy. Your Music, Your Choice. 
            Explore music, search for your favorite songs, and create playlists 
            with flexible options that suit your budget.
        </p>
        
        <nav class="hero-actions">
            <a href="Library.html">Browse Music</a>
            <a href="packages.html">View Packages</a>
        </nav>
    </header>

    <figure class="hero-image">
        <img src="Pics/hero-music.png" alt="Illustration of a person listening to music">
    </figure><hr>

    
    <form method="get">
        <filedset><legend><h3>Search</h3></legend></filedset>
        <feiledset>
            <table>
                <tr>
                    <td><label for="title">Enter music title</label></td>
                    <td><input id="title" name="st" type="text"><br></td>
                </tr>
                <tr>
                    <td><label for="name">Enter Artist's Name</label></td>
                    <td><input id="name" name="sa" type="text"><br></td>
                </tr>
                <tr>
                    <td><label for="genre">Enter Music Genre</label></td>
                    <td><input id="genre" name="sg" type="text"><br></td>
                </tr>
            </table>
            <input type="submit" value="Submit">
        </feiledset>

    </form>

</section>
    
</body>
</html>
